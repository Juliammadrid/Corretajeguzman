<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1400" viewBox="0 0 1120 1400" role="img" aria-labelledby="title desc">
<title id="title">Compara los planes de Corretaje Guzmán para propietarios</title><desc id="desc">Prioridad: comisión del 50% de un mes de arriendo, solo si se concreta. Básico: 0% de comisión para el propietario.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07050d"/><stop offset=".6" stop-color="#1b1038"/><stop offset="1" stop-color="#080710"/></linearGradient><linearGradient id="pri" x2="1" y2="1"><stop stop-color="#25104f"/><stop offset="1" stop-color="#100c20"/></linearGradient><linearGradient id="basic" x2="1" y2="1"><stop stop-color="#1a172a"/><stop offset="1" stop-color="#100e1c"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1120" height="1400" rx="32" fill="url(#bg)"/>
