<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zumi · Corretaje Guzmán</title><link rel="stylesheet" href="assistant.css"></head><body class="official-site"><canvas id="zumiCanvas" aria-label="Zumi"></canvas><div id="zumiFloatingDock" class="zumi-floating-dock">
    <div class="webFigure" id="webFigure" title="Haz clic en Zumi para conversar" role="button" tabindex="0" aria-label="Abrir conversación con Zumi"></div>
    <div id="webHint" class="webHint">¿Necesitas ayuda?</div>
    <button type="button" id="openChat" class="openChat" aria-expanded="false">💬 Conversa con Zumi</button>
  </div>
  <aside id="zumiWelcomePopup" class="zumi-welcome-popup" hidden aria-label="Bienvenida de Zumi">
    <div class="zumi-welcome-head">
      <div class="zumi-welcome-identity"><span aria-hidden="true">✦</span><div><strong>¡Hola! Soy Zumi 💜</strong><small>Tu asistente inmobiliario</small></div></div>
      <button type="button" id="zumiWelcomeClose" class="zumi-welcome-close" aria-label="Cerrar bienvenida">×</button>
    </div>
    <p>Te ayudo a encontrar tu próximo hogar o a arrendar tu propiedad. ¿Qué necesitas?</p>
    <div class="zumi-welcome-options">
      <button type="button" data-zumi-quick="rent">🔑 <span>Busco arrendar</span></button>
      <button type="button" data-zumi-quick="buy">🏠 <span>Busco comprar</span></button>
      <button type="button" data-zumi-quick="owner">💜 <span>Soy propietario</span></button>
      <button type="button" data-zumi-quick="parcel">🌿 <span>Ver parcelas</span></button>
    </div>
    <button type="button" id="zumiWelcomeProjects" class="zumi-welcome-projects">Conocer proyectos nuevos <span aria-hidden="true">→</span></button>
  </aside>
  <section id="chatPanel" class="chat" hidden aria-label="Conversación con Zumi">
    <div class="chatTitle"><div class="chatHead"><span class="chatDot">✦</span><div><b>Zumi · tu compañero inmobiliario</b><small>Guía interactiva de Corretaje Guzmán</small></div></div><div class="chatHeadActions"><button type="button" id="zumiReplySoundToggle" class="zumi-reply-sound" title="Silenciar aviso de respuestas" aria-label="Silenciar aviso de respuestas" aria-pressed="true">🔉</button><button type="button" id="resetChat" class="chatReset" title="Reiniciar conversación" aria-label="Reiniciar conversación">↺</button><button id="closeChat" type="button" aria-label="Cerrar conversación" class="closeChat">×</button></div></div>
    <div id="chatHistory" class="chatHistory" aria-live="polite"></div>
    <div id="chatComposer" class="chatComposer"><form id="chatForm" class="chatForm"><input id="answer" autocomplete="off" maxlength="1000" placeholder="Escribe tu respuesta…" aria-label="Responder a Zumi"><button class="zumi-ai-mic" type="button" id="zumi-record" aria-label="Grabar audio" title="Grabar audio">🎙</button><button class="zumi-ai-mic" type="button" id="zumi-attach" aria-label="Adjuntar audio" title="Adjuntar audio">📎</button><input hidden style="display:none" type="file" id="zumi-file" accept="audio/*,.m4a,.mp3,.webm,.wav,.ogg,.flac"><button type="submit" aria-label="Enviar respuesta">➤</button></form><div class="privacy">Tú decides cuándo contactar por WhatsApp.</div></div>
  </section><script src="catalog.js"></script><script src="assistant.js"></script><script src="conversation.js"></script></body></html>
